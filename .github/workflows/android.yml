name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/calude-release.jks" -storepass calude-release -keypass calude-release -alias calude -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Calude Release"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/calude-release.jks" --ks-pass pass:calude-release --key-pass pass:calude-release --out app/build/outputs/apk/release/Calude-1.0.apk "$APK"
          "$APKSIGNER" verify app/build/outputs/apk/release/Calude-1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calude-1.0-android
          path: app/build/outputs/apk/release/Calude-1.0.apk
          if-no-files-found: error
      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Calude-1.0.apk
